[project]
name = "multi-agent_customer_support"
version = "0.1.0"
description = "Multi Agent Customer Support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.5.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.32",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
